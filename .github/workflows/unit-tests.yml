---
name: unit tests

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  GOPATH: ${{ github.workspace }}/go
  REPOPATH: ${{ github.workspace }}/go//src/github.com/${{ github.repository }}

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version:
          - 1.21
          - 1.22
    env:
      GOLANGCI_LINT_VERSION: v2.1.6
    defaults:
      run:
        working-directory: ${{ env.REPOPATH }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          path: ${{ env.REPOPATH }}
          fetch-depth: 0

      - name: install go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: run linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ env.REPOPATH }}

      - name: run tests
        run: go test -v -cover ./...

  yaegi:
    name: yaegi
    runs-on: ubuntu-latest
    strategy:
      matrix:
        yaegi-version:
          - v0.15.0
          - v0.16.1
    defaults:
      run:
        working-directory: ${{ env.REPOPATH }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          path: ${{ env.REPOPATH }}
          fetch-depth: 0

      - name: install go
        uses: actions/setup-go@v5
        with:
          go-version: 1.21
          cache: false

      - name: install yaegi ${{ matrix.yaegi-version }}
        run: |
          curl -sfL https://raw.githubusercontent.com/traefik/yaegi/master/install.sh | bash -s -- -b /usr/local/bin ${{ matrix.yaegi-version }}

      - name: run tests
        run: |
          for pkg in $(go list ./...); do
            yaegi test -v "${pkg}"
          done
  # A remote install only works for a catalogued version: Traefik asks
  # /public/validate/<module>/<version> and proceeds on 200. A hash is not an
  # alternative - the registry repacks archives for the same version, so a pin
  # eventually stops matching and disables the plugin. This job reports whether
  # the tag is installable, so a release is not mistaken for a working one.
  catalogue:
    name: catalogue record
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: check the plugin catalogue
        run: |
          module=github.com/ksmarty/traefik-authentik-forward-plugin
          url="https://plugins.traefik.io/public/validate/${module}/${GITHUB_REF_NAME}"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo 000)
          echo "${GITHUB_REF_NAME}: validate -> ${code}"
          if [ "$code" != "200" ]; then
            echo "::warning::${GITHUB_REF_NAME} is not catalogued yet (validate ${code}); a remote install needs newer-less config or a catalogued version"
          fi
          {
            echo "### Catalogue status for ${GITHUB_REF_NAME}"
            echo
            echo "\`/public/validate\` returned **${code}** (200 = installable without a hash, no pin needed)."
          } >> "$GITHUB_STEP_SUMMARY"
